[workspace]
resolver = "2"
members = ["os", "gfx", "proto", "boot"]
default-members = ["os"]

[workspace.package]
version = "0.2.4"
edition = "2021"
license = "MIT"

[profile.release]
codegen-units = 1
debug = 2          # keep symbols in the ELF; they never reach the flash image
lto = "fat"
opt-level = 3
overflow-checks = false

[profile.dev]
codegen-units = 1
debug = 2
lto = "fat"
opt-level = "s"    # unoptimised Cortex-M0+ code is too slow and too large to be useful
overflow-checks = true

# Local copy of the radio driver with one addition: reading the chip's own
# GPIO pins, which is how a Pico W senses USB power. See vendor/cyw43/README.
[patch.crates-io]
cyw43 = { path = "vendor/cyw43" }
